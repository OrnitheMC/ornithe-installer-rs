<!doctype html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ornithe Installer</title>
    <script type="module">
      import init, * as bindings from "./public/ornithe-installer-rs.js";
      const wasm = await init({
        module_or_path: "./ornithe-installer-rs_bg.wasm",
      });

      window.wasmBindings = bindings;
    </script>

    <link rel="icon" href="res/icon.png" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="white"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#404040"
    />

    <style>
      body {
        background: #909090;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #404040;
        }
      }

      .centered {
        margin-right: auto;
        margin-left: auto;
        display: block;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #f0f0f0;
        font-size: 24px;
        font-family: Ubuntu-Light, Helvetica, sans-serif;
        text-align: center;
        width: calc(min(100%, 25em));
      }

      /* Loading animation from https://loading.io/css/ */
      .lds-dual-ring {
        display: inline-block;
        width: 24px;
        height: 24px;
      }

      .lds-dual-ring:after {
        content: " ";
        display: block;
        width: 24px;
        height: 24px;
        margin: 0px;
        border-radius: 50%;
        border: 3px solid #fff;
        border-color: #fff transparent #fff transparent;
        animation: lds-dual-ring 1.2s linear infinite;
      }

      @keyframes lds-dual-ring {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <!-- the loading spinner will be removed in gui_web.rs -->
    <!-- make sure the ids of these elements are kept, they are referenced in rust (both gui_we.rs and cli.rs)! -->
    <div class="centered">
      <div id="loading_text">
        <noscript
          >You need javascript to use this page. Alternatively, you may use the
          downloadable version of this installer.</noscript
        >
        <p style="font-size: 16px" id="loading_status">Loading…</p>
        <div class="lds-dual-ring"></div>
      </div>
    </div>
  </body>
</html>
